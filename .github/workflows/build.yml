name: 2. Build patched IPA
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Official branch/tag/commit to build (blank = default branch)"
        required: false
        default: ""
      apply_patch:
        description: "Apply the iOS texture cache fix"
        type: boolean
        default: true

permissions:
  contents: read

env:
  XCODE_PROJECT: src/MeloNX/MeloNX.xcodeproj
  XCODE_SCHEME: MeloNX
  XCODE_CONFIGURATION: Release
  DERIVED_DATA_PATH: build/DerivedData
  IPA_OUTPUT_DIR: build/ipa
  RESULT_BUNDLE_PATH: build/MeloNX.xcresult

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: melonx
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      - name: Clone official MeloNX source
        working-directory: .
        run: |
          set -euo pipefail
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git clone https://git.ryujinx.app/projects/MeloNX.git melonx
          cd melonx
          if [ -n "${{ inputs.ref }}" ]; then git checkout "${{ inputs.ref }}"; fi
          git log -1 --format='Building %h (%cd) %s'
          grep -n VERSION src/MeloNX/MeloNX.xcconfig || true

      - name: Fetch LFS binaries
        run: |
          set -uo pipefail
          if git lfs pull; then echo "LFS from official OK"; exit 0; fi
          echo "::warning::Official LFS fetch failed, trying GitHub mirror"
          cd .. && GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/AzureDominus/melonx.git mirror
          cd mirror && git lfs pull --include="*.dylib"
          cd ../melonx
          git lfs ls-files -n | while read -r f; do
            if [ -f "../mirror/$f" ] && [ "$(wc -c < "$f")" -lt 300 ]; then cp "../mirror/$f" "$f"; echo "copied $f"; fi
          done

      - name: Apply texture cache patch
        if: ${{ inputs.apply_patch }}
        run: python3 ../tools/scripts/apply_patch.py . && git diff

      - name: Select Xcode
        run: |
          set -euo pipefail
          x="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort -V | tail -n 1)"
          sudo xcode-select -s "$x/Contents/Developer"; xcodebuild -version

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: melonx/global.json

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Resolve Swift packages
        run: xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -resolvePackageDependencies

      - name: Build unsigned app
        run: |
          set -euo pipefail
          libdeps="$PWD/build/libdeps"
          mkdir -p build
          ln -sfn "$PWD/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries" "$libdeps"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" clean build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES ONLY_ACTIVE_ARCH=NO \
            "LIBRARY_SEARCH_PATHS=\$(inherited) $libdeps" \
            "OTHER_LDFLAGS=\$(inherited) $libdeps/Ryujinx.Headless.SDL2.dylib"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: melonx/build/DerivedData/Logs
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$(find "$DERIVED_DATA_PATH/Build/Products/${XCODE_CONFIGURATION}-iphoneos" -maxdepth 1 -name 'MeloNX.app' -type d -print -quit)"
          dylib="$PWD/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"
          [ -f "$dylib" ] || dylib="$(find src -name 'Ryujinx.Headless.SDL2.dylib' -type f -print -quit)"
          mkdir -p "$app/Frameworks"; ditto "$dylib" "$app/Frameworks/Ryujinx.Headless.SDL2.dylib"
          mkdir -p "$IPA_OUTPUT_DIR/Payload"; ditto "$app" "$IPA_OUTPUT_DIR/Payload/MeloNX.app"
          (cd "$IPA_OUTPUT_DIR" && zip -qry MeloNX-patched-unsigned.ipa Payload)
          du -sh "$IPA_OUTPUT_DIR/MeloNX-patched-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: MeloNX-patched-unsigned-ipa
          path: melonx/build/ipa/MeloNX-patched-unsigned.ipa
          if-no-files-found: error
